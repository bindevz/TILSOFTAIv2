name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Verify repo clean
      shell: pwsh
      run: ./tools/verify-repo-clean.ps1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Check for vulnerable packages
      shell: pwsh
      run: |
        Write-Host "Checking for vulnerable packages..."
        $output = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
        Write-Host $output
        
        if ($output -match "has the following vulnerable packages") {
          Write-Error "Vulnerable packages detected. Please update dependencies."
          exit 1
        }
        
        Write-Host "No vulnerable packages found."
    
    - name: Validate Database Migrations
      shell: pwsh
      run: |
        Write-Host "Building migration tool..."
        dotnet build tools/TILSOFTAI.Migrations/TILSOFTAI.Migrations.csproj --configuration Release
        
        Write-Host "Validating migration scripts..."
        # Dry-run validation without actual database connection
        # This ensures SQL scripts are syntactically correct and embedded properly
        $embeddedScripts = dotnet run --project tools/TILSOFTAI.Migrations/TILSOFTAI.Migrations.csproj -- status --connection "Server=.;Database=TILSOFTAI_CI_VALIDATION;Integrated Security=true;" --pending-only 2>&1
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Migration scripts are valid."
        } else {
          Write-Warning "Migration validation encountered issues (may be expected if no test database available)"
          Write-Host "This is informational only - build will continue."
        }
    
    - name: Build
      run: dotnet build --no-restore --configuration Release

    
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
    
    - name: SQL Lint Check
      shell: pwsh
      run: |
        Write-Host "Checking SQL files for common issues..."
        $sqlFiles = Get-ChildItem -Path sql -Filter *.sql -Recurse -ErrorAction SilentlyContinue
        $warningCount = 0
        
        foreach ($file in $sqlFiles) {
          $content = Get-Content $file.FullName -Raw
          
          # Check for SELECT *
          if ($content -match "SELECT \*") {
            Write-Warning "Found SELECT * in $($file.Name) - consider explicit columns for production code"
            $warningCount++
          }
          
          # Check for missing SET NOCOUNT ON in procedures
          if ($content -match "CREATE (OR ALTER )?PROCEDURE" -and $content -notmatch "SET NOCOUNT ON") {
            Write-Warning "Missing SET NOCOUNT ON in procedure $($file.Name)"
            $warningCount++
          }
        }
        
        Write-Host "SQL lint check complete. Found $warningCount potential issues."
        if ($warningCount -gt 0) {
          Write-Host "These are warnings only - build will continue."
        }

    - name: Verify Required SQL Capability Files
      shell: pwsh
      run: |
        Write-Host "Verifying required SQL capability files exist..." -ForegroundColor Cyan
        $requiredModules = @(
          "sql/01_core",
          "sql/02_capabilities/analytics",
          "sql/99_seed/analytics"
        )
        $requiredFiles = @(
          "sql/02_capabilities/analytics/001_tables_analytics.sql",
          "sql/02_capabilities/analytics/003_sps_app_analytics.sql",
          "sql/02_capabilities/analytics/004_sps_ai_analytics.sql",
          "sql/02_capabilities/analytics/005_sps_ai_analytics_execute.sql",
          "sql/99_seed/analytics/001_seed_toolcatalog_analytics.sql"
        )
        
        $missing = @()
        
        # Check required directories
        foreach ($module in $requiredModules) {
          if (-not (Test-Path $module)) {
            $missing += "Directory: $module"
          }
        }
        
        # Check required files
        foreach ($file in $requiredFiles) {
          if (-not (Test-Path $file)) {
            $missing += "File: $file"
          }
        }
        
        if ($missing.Count -gt 0) {
          Write-Host ""
          Write-Host "ERROR: Required SQL capability files are missing!" -ForegroundColor Red
          foreach ($m in $missing) {
            Write-Host "  - $m" -ForegroundColor Red
          }
          Write-Host ""
          Write-Host "The analytics capability requires these files for proper operation." -ForegroundColor Yellow
          exit 1
        }
        
        Write-Host "All required SQL capability files verified:" -ForegroundColor Green
        foreach ($file in $requiredFiles) {
          Write-Host "  OK $file" -ForegroundColor Green
        }

    - name: Verify Compatibility Inventory
      shell: pwsh
      run: |
        Write-Host "Verifying compatibility inventory..." -ForegroundColor Cyan
        $inventoryPath = "docs/compatibility_inventory.json"
        if (-not (Test-Path $inventoryPath)) {
          Write-Error "Missing compatibility inventory: $inventoryPath"
          exit 1
        }

        $inventory = Get-Content $inventoryPath -Raw | ConvertFrom-Json
        if ($inventory.schemaVersion -ne 1) {
          Write-Error "Unsupported compatibility inventory schema version: $($inventory.schemaVersion)"
          exit 1
        }

        if (Test-Path "sql/01_core/078_tables_module_runtime_catalog.sql") {
          Write-Error "ModuleRuntimeCatalog must remain outside the default core SQL deployment path."
          exit 1
        }

        $repoPaths = @()
        foreach ($entry in $inventory.physicalStorageNames + $inventory.legacyProcedures + $inventory.forwardWrappers) {
          foreach ($path in $entry.repoPaths) {
            $repoPaths += $path
          }
        }
        foreach ($entry in $inventory.legacyDiagnostics) {
          $repoPaths += $entry.deploymentPath
        }

        $missing = $repoPaths | Sort-Object -Unique | Where-Object { -not (Test-Path $_) }
        if ($missing.Count -gt 0) {
          Write-Error "Compatibility inventory references missing paths: $($missing -join ', ')"
          exit 1
        }

        Write-Host "Compatibility inventory verified." -ForegroundColor Green

    - name: Verify Release Evidence Bundle Flow
      shell: pwsh
      run: |
        Write-Host "Generating certification evidence smoke manifest..." -ForegroundColor Cyan
        ./tools/evidence/New-CertificationRunManifest.ps1 `
          -ReleaseId "ci-evidence-smoke" `
          -Environment "staging" `
          -OutputPath "artifacts/evidence-smoke/ci-evidence-smoke/certification-run-manifest.json" `
          -CatalogSourceMode "platform" `
          -ChangeTicketId "TICKET-2600" `
          -TenantScopeRef "artifact://ci-evidence-smoke/tenant-scope.json" `
          -ExecutionWindowId "ci-certification-window" `
          -OperatorId "ci" `
          -EvidenceRefsPath "docs/certification_evidence_refs.example.json" `
          -AllowExampleEvidence
        Copy-Item "docs/certification_trusted_evidence_refs.example.json" "artifacts/evidence-smoke/ci-evidence-smoke/trusted-evidence-refs.json" -Force

        ./tools/evidence/Test-CertificationRunManifest.ps1 `
          -ManifestPath "artifacts/evidence-smoke/ci-evidence-smoke/certification-run-manifest.json" `
          -AllowExampleEvidence

        ./tools/evidence/New-CertificationExecutionSession.ps1 `
          -CertificationRunPath "artifacts/evidence-smoke/ci-evidence-smoke/certification-run-manifest.json" `
          -OutputPath "artifacts/evidence-smoke/ci-evidence-smoke/certification-execution-session.json" `
          -TrustedEvidencePath "artifacts/evidence-smoke/ci-evidence-smoke/trusted-evidence-refs.json" `
          -TrustPolicyPath "docs/certification_execution_trust_policy.template.json"

        ./tools/evidence/Test-CertificationExecutionSession.ps1 `
          -SessionPath "artifacts/evidence-smoke/ci-evidence-smoke/certification-execution-session.json" `
          -AllowBlocked `
          -AllowExampleEvidence

        ./tools/evidence/New-CertificationExecutionSummary.ps1 `
          -SessionPath "artifacts/evidence-smoke/ci-evidence-smoke/certification-execution-session.json" `
          -OutputRoot "artifacts/evidence-smoke/ci-evidence-smoke"

        Write-Host "Generating release evidence smoke bundle..." -ForegroundColor Cyan
        ./tools/evidence/New-ReleaseEvidenceBundle.ps1 `
          -ReleaseId "ci-evidence-smoke" `
          -Environment "staging" `
          -OutputRoot "artifacts/evidence-smoke" `
          -CertificationRunPath "artifacts/evidence-smoke/ci-evidence-smoke/certification-run-manifest.json" `
          -WindowStartUtc "2026-01-01T00:00:00Z" `
          -UsageSummaryUri "artifact://ci-evidence-smoke/usage-summary.json" `
          -RetirementReadinessUri "artifact://ci-evidence-smoke/readiness.json" `
          -RollbackPlanUri "artifact://ci-evidence-smoke/rollback.md" `
          -OperatorCommunicationUri "artifact://ci-evidence-smoke/operator-communication.md"

        ./tools/evidence/Test-ReleaseEvidenceBundle.ps1 `
          -BundlePath "artifacts/evidence-smoke/ci-evidence-smoke"

        ./tools/evidence/New-CertificationReviewSummary.ps1 `
          -CertificationRunPath "artifacts/evidence-smoke/ci-evidence-smoke/certification-run-manifest.json" `
          -BundlePath "artifacts/evidence-smoke/ci-evidence-smoke" `
          -OutputRoot "artifacts/evidence-smoke/ci-evidence-smoke"

        ./tools/evidence/Test-CertificationReviewSummary.ps1 `
          -SummaryPath "artifacts/evidence-smoke/ci-evidence-smoke/certification-review-summary.json" `
          -AllowBlocked `
          -AllowExampleEvidence

        Write-Host "Generating accepted live-certification smoke package..." -ForegroundColor Cyan
        $acceptedRefs = @{
          runbook_execution = "artifact://ci-acceptance-smoke/runbook-execution.json"
          preview_failure_drill = "artifact://ci-acceptance-smoke/preview-failure-drill.json"
          version_conflict_drill = "artifact://ci-acceptance-smoke/version-conflict-drill.json"
          duplicate_submit_drill = "artifact://ci-acceptance-smoke/duplicate-submit-drill.json"
          sql_apply_outage_drill = "artifact://ci-acceptance-smoke/sql-apply-outage-drill.json"
          fallback_risk_drill = "artifact://ci-acceptance-smoke/fallback-risk-drill.json"
          operator_signoff = "artifact://ci-acceptance-smoke/operator-signoff.json"
        }
        New-Item -ItemType Directory -Force -Path "artifacts/evidence-smoke/ci-acceptance-smoke" | Out-Null
        $acceptedRefs | ConvertTo-Json -Depth 4 | Set-Content -Path "artifacts/evidence-smoke/ci-acceptance-smoke/evidence-refs.json" -Encoding utf8
        Copy-Item "docs/certification_trusted_evidence_refs.example.json" "artifacts/evidence-smoke/ci-acceptance-smoke/trusted-evidence-refs.json" -Force

        ./tools/evidence/New-CertificationRunManifest.ps1 `
          -ReleaseId "ci-acceptance-smoke" `
          -Environment "staging" `
          -OutputPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-run-manifest.json" `
          -CatalogSourceMode "platform" `
          -ChangeTicketId "TICKET-2700" `
          -TenantScopeRef "artifact://ci-acceptance-smoke/tenant-scope.json" `
          -ExecutionWindowId "ci-live-certification-window" `
          -OperatorId "ci-operator" `
          -ApproverId "ci-approver" `
          -EvidenceRefsPath "artifacts/evidence-smoke/ci-acceptance-smoke/evidence-refs.json"

        ./tools/evidence/Test-CertificationRunManifest.ps1 `
          -ManifestPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-run-manifest.json"

        ./tools/evidence/New-CertificationExecutionSession.ps1 `
          -CertificationRunPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-run-manifest.json" `
          -OutputPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.json" `
          -TrustedEvidencePath "artifacts/evidence-smoke/ci-acceptance-smoke/trusted-evidence-refs.json" `
          -TrustPolicyPath "docs/certification_execution_trust_policy.template.json"

        ./tools/evidence/Test-CertificationExecutionSession.ps1 `
          -SessionPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.json"

        ./tools/evidence/New-CertificationExecutionSummary.ps1 `
          -SessionPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.json" `
          -OutputRoot "artifacts/evidence-smoke/ci-acceptance-smoke"

        ./tools/evidence/New-ReleaseEvidenceBundle.ps1 `
          -ReleaseId "ci-acceptance-smoke" `
          -Environment "staging" `
          -OutputRoot "artifacts/evidence-smoke" `
          -CertificationRunPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-run-manifest.json" `
          -WindowStartUtc "2026-01-01T00:00:00Z" `
          -UsageSummaryUri "artifact://ci-acceptance-smoke/usage-summary.json" `
          -RetirementReadinessUri "artifact://ci-acceptance-smoke/readiness.json" `
          -RollbackPlanUri "artifact://ci-acceptance-smoke/rollback.md" `
          -OperatorCommunicationUri "artifact://ci-acceptance-smoke/operator-communication.md"

        ./tools/evidence/New-CertificationReviewSummary.ps1 `
          -CertificationRunPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-run-manifest.json" `
          -BundlePath "artifacts/evidence-smoke/ci-acceptance-smoke" `
          -OutputRoot "artifacts/evidence-smoke/ci-acceptance-smoke"

        ./tools/evidence/Test-CertificationReviewSummary.ps1 `
          -SummaryPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-review-summary.json"

        ./tools/evidence/New-CertificationAcceptance.ps1 `
          -CertificationRunPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-run-manifest.json" `
          -SummaryPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-review-summary.json" `
          -ExecutionSessionPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.json" `
          -BundlePath "artifacts/evidence-smoke/ci-acceptance-smoke" `
          -AcceptedBy "ci-operator" `
          -ApprovedBy "ci-approver"

        ./tools/evidence/Test-CertificationAcceptance.ps1 `
          -AcceptancePath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-acceptance.json"

        ./tools/evidence/New-CertificationAcceptanceSummary.ps1 `
          -AcceptancePath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-acceptance.json" `
          -OutputRoot "artifacts/evidence-smoke/ci-acceptance-smoke"

        ./tools/evidence/New-CertificationReleaseAuthorityPacket.ps1 `
          -SessionPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.json" `
          -ReviewSummaryPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-review-summary.json" `
          -AcceptancePath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-acceptance.json" `
          -OutputRoot "artifacts/evidence-smoke/ci-acceptance-smoke"

        ./tools/evidence/Test-ReleaseEvidenceBundle.ps1 `
          -BundlePath "artifacts/evidence-smoke/ci-acceptance-smoke" `
          -RequireAcceptedCertification

        Write-Host "Verifying stale execution and acceptance dependency blocking..." -ForegroundColor Cyan
        function Assert-ExpectedFailure {
          param(
            [scriptblock]$Action,
            [string]$FailureMessage,
            [string]$SuccessMessage
          )

          try {
            & $Action
            throw $FailureMessage
          } catch {
            if ($_.Exception.Message -match $FailureMessage) {
              throw
            }

            Write-Host $SuccessMessage -ForegroundColor Green
          }
        }

        $baseSessionPath = "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.json"
        $baseSession = Get-Content $baseSessionPath -Raw | ConvertFrom-Json
        $baseRunbookDrill = $baseSession.drillLedger | Where-Object { $_.drillKind -eq "runbook_execution" } | Select-Object -First 1

        $staleSessionPath = "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.stale.json"
        $staleSession = Get-Content "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.json" -Raw | ConvertFrom-Json
        $staleDrill = $staleSession.drillLedger | Where-Object { $_.drillKind -eq "runbook_execution" } | Select-Object -First 1
        $staleDrill.collectedAtUtc = "2000-01-01T00:00:00Z"
        $staleSession.executionState = "blocked"
        $staleSession.blockers = @("stale_evidence")
        $staleSession.decisionInputs.staleEvidencePresent = $true
        $staleSession.decisionInputs.requiredDrillsCompleted = $false
        $staleSession | ConvertTo-Json -Depth 12 | Set-Content -Path $staleSessionPath -Encoding utf8

        Assert-ExpectedFailure `
          -Action { ./tools/evidence/Test-CertificationExecutionSession.ps1 -SessionPath $staleSessionPath } `
          -FailureMessage "Expected stale execution session validation to fail." `
          -SuccessMessage "Stale execution session failed validation as expected."

        $missingHashSessionPath = "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.missing-hash.json"
        $missingHashSession = Get-Content $baseSessionPath -Raw | ConvertFrom-Json
        $missingHashDrill = $missingHashSession.drillLedger | Where-Object { $_.drillKind -eq "runbook_execution" } | Select-Object -First 1
        $missingHashDrill.artifactHash = ""
        $missingHashDrill.trustDecision = "blocked"
        $missingHashSession.executionState = "blocked"
        $missingHashSession.blockers = @("trusted_evidence_unverified")
        $missingHashSession.decisionInputs.trustedEvidenceVerified = $false
        $missingHashSession.decisionInputs.trustedEvidenceReady = $false
        $missingHashSession | ConvertTo-Json -Depth 12 | Set-Content -Path $missingHashSessionPath -Encoding utf8
        Assert-ExpectedFailure `
          -Action { ./tools/evidence/Test-CertificationExecutionSession.ps1 -SessionPath $missingHashSessionPath } `
          -FailureMessage "Expected missing hash validation to fail." `
          -SuccessMessage "Missing hash validation failed as expected."

        $unverifiedSessionPath = "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.unverified.json"
        $unverifiedSession = Get-Content $baseSessionPath -Raw | ConvertFrom-Json
        $unverifiedDrill = $unverifiedSession.drillLedger | Where-Object { $_.drillKind -eq "runbook_execution" } | Select-Object -First 1
        $unverifiedDrill.verificationStatus = "unverified"
        $unverifiedDrill.trustDecision = "blocked"
        $unverifiedSession.executionState = "blocked"
        $unverifiedSession.blockers = @("trusted_evidence_unverified")
        $unverifiedSession.decisionInputs.trustedEvidenceVerified = $false
        $unverifiedSession.decisionInputs.trustedEvidenceReady = $false
        $unverifiedSession | ConvertTo-Json -Depth 12 | Set-Content -Path $unverifiedSessionPath -Encoding utf8
        Assert-ExpectedFailure `
          -Action { ./tools/evidence/Test-CertificationExecutionSession.ps1 -SessionPath $unverifiedSessionPath } `
          -FailureMessage "Expected unverified evidence validation to fail." `
          -SuccessMessage "Unverified evidence validation failed as expected."

        $insufficientTierPath = "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.insufficient-tier.json"
        $insufficientTierSession = Get-Content $baseSessionPath -Raw | ConvertFrom-Json
        $insufficientTierDrill = $insufficientTierSession.drillLedger | Where-Object { $_.drillKind -eq "runbook_execution" } | Select-Object -First 1
        $insufficientTierDrill.trustTier = "metadata_verified"
        $insufficientTierDrill.policyMinimumTrustTier = "provider_verified"
        $insufficientTierDrill.trustDecision = "blocked"
        $insufficientTierSession.executionState = "blocked"
        $insufficientTierSession.blockers = @("trusted_evidence_policy_violation")
        $insufficientTierSession.decisionInputs.trustedEvidencePolicySatisfied = $false
        $insufficientTierSession.decisionInputs.trustedEvidenceReady = $false
        $insufficientTierSession | ConvertTo-Json -Depth 12 | Set-Content -Path $insufficientTierPath -Encoding utf8
        Assert-ExpectedFailure `
          -Action { ./tools/evidence/Test-CertificationExecutionSession.ps1 -SessionPath $insufficientTierPath } `
          -FailureMessage "Expected insufficient trust tier validation to fail." `
          -SuccessMessage "Insufficient trust tier validation failed as expected."

        $invalidWaiverPath = "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.invalid-waiver.json"
        $invalidWaiverSession = Get-Content $baseSessionPath -Raw | ConvertFrom-Json
        $invalidWaiverSession.waivers = @(
          @{
            waiverId = "waiver://invalid-expired"
            authority = "release_authority"
            scope = "drill"
            reason = "expired waiver"
            expiresAtUtc = "2000-01-01T00:00:00Z"
            linkedDrills = @("preview_failure_drill")
            nonWaivable = $false
            status = "active"
          }
        )
        $invalidWaiverSession.executionState = "blocked"
        $invalidWaiverSession.blockers = @("invalid_waiver")
        $invalidWaiverSession.decisionInputs.invalidWaiverPresent = $true
        $invalidWaiverSession.decisionInputs.trustedEvidenceReady = $false
        $invalidWaiverSession | ConvertTo-Json -Depth 12 | Set-Content -Path $invalidWaiverPath -Encoding utf8
        Assert-ExpectedFailure `
          -Action { ./tools/evidence/Test-CertificationExecutionSession.ps1 -SessionPath $invalidWaiverPath } `
          -FailureMessage "Expected invalid waiver validation to fail." `
          -SuccessMessage "Invalid waiver validation failed as expected."

        $providerProofGapPath = "artifacts/evidence-smoke/ci-acceptance-smoke/certification-execution-session.provider-proof-gap.json"
        $providerProofGapSession = Get-Content $baseSessionPath -Raw | ConvertFrom-Json
        $providerProofGapDrill = $providerProofGapSession.drillLedger | Where-Object { $_.drillKind -eq "runbook_execution" } | Select-Object -First 1
        $providerProofGapDrill.verifierClass = "provider"
        $providerProofGapDrill.providerHashRecomputed = $false
        $providerProofGapDrill.providerProvenanceProofUri = ""
        $providerProofGapDrill.trustDecision = "blocked"
        $providerProofGapSession.executionState = "blocked"
        $providerProofGapSession.blockers = @("provider_provenance_gap")
        $providerProofGapSession.decisionInputs.providerProvenanceComplete = $false
        $providerProofGapSession.decisionInputs.trustedEvidenceReady = $false
        $providerProofGapSession | ConvertTo-Json -Depth 12 | Set-Content -Path $providerProofGapPath -Encoding utf8
        Assert-ExpectedFailure `
          -Action { ./tools/evidence/Test-CertificationExecutionSession.ps1 -SessionPath $providerProofGapPath } `
          -FailureMessage "Expected provider provenance proof validation to fail." `
          -SuccessMessage "Provider provenance proof validation failed as expected."

        ./tools/evidence/New-CertificationAcceptance.ps1 `
          -CertificationRunPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-run-manifest.json" `
          -SummaryPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-review-summary.json" `
          -ExecutionSessionPath $staleSessionPath `
          -BundlePath "artifacts/evidence-smoke/ci-acceptance-smoke" `
          -OutputPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-acceptance.stale.json" `
          -AcceptedBy "ci-operator" `
          -ApprovedBy "ci-approver"

        Assert-ExpectedFailure `
          -Action { ./tools/evidence/Test-CertificationAcceptance.ps1 -AcceptancePath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-acceptance.stale.json" } `
          -FailureMessage "Expected acceptance validation to fail for incomplete execution session." `
          -SuccessMessage "Acceptance dependency on execution completeness enforced."

        ./tools/evidence/New-CertificationAcceptance.ps1 `
          -CertificationRunPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-run-manifest.json" `
          -SummaryPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-review-summary.json" `
          -ExecutionSessionPath $unverifiedSessionPath `
          -BundlePath "artifacts/evidence-smoke/ci-acceptance-smoke" `
          -OutputPath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-acceptance.unverified.json" `
          -AcceptedBy "ci-operator" `
          -ApprovedBy "ci-approver"

        Assert-ExpectedFailure `
          -Action { ./tools/evidence/Test-CertificationAcceptance.ps1 -AcceptancePath "artifacts/evidence-smoke/ci-acceptance-smoke/certification-acceptance.unverified.json" } `
          -FailureMessage "Expected acceptance validation to fail for trust semantics." `
          -SuccessMessage "Acceptance dependency on trusted evidence semantics enforced."

        Write-Host "Certification and release evidence flow verified." -ForegroundColor Green

    # PATCH 31.02: Fixed secret scanning - now includes JSON and fails on detection
    - name: Verify No Hardcoded Credentials
      shell: pwsh
      run: |
        Write-Host "Checking for hardcoded credentials..." -ForegroundColor Cyan
        $issues = @()
        
        # Scan ALL relevant files including JSON (the previous version excluded *.json)
        $files = Get-ChildItem -Path ./src -Recurse -Include "*.cs", "*.json", "*.config", "*.ps1", "*.xml" |
          Where-Object { $_.FullName -notmatch '(\\|/)bin(\\|/)' -and $_.FullName -notmatch '(\\|/)obj(\\|/)' }
        
        foreach ($file in $files) {
          $content = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
          if (-not $content) { continue }
          
          # Check for real credentials (not placeholders)
          if ($content -match '(?i)(Password|Pwd)\s*=\s*(?!(__|\\$env:|YOUR_|%%))([^;\\"]{3,})') {
            # Exclude known safe patterns
            if ($content -notmatch '__SQL_CONNECTION_STRING_FROM_ENV') {
              $issues += "$($file.FullName): potential hardcoded credential"
            }
          }
          
          # Check for API keys / tokens
          if ($content -match '(?i)(api[_-]?key|secret[_-]?key|access[_-]?token)\s*[:=]\s*[\\"''][a-zA-Z0-9+/=]{16,}') {
            $issues += "$($file.FullName): potential API key/token"
          }
        }
        
        if ($issues.Count -gt 0) {
          Write-Host ""
          Write-Host "ERROR: Hardcoded credentials detected!" -ForegroundColor Red
          foreach ($issue in $issues) {
            Write-Host "  - $issue" -ForegroundColor Red
          }
          exit 1  # FAIL CI, not just warning
        }
        
        Write-Host "No hardcoded credentials detected." -ForegroundColor Green

  # PATCH 31.04: Integration tests with SQL Server container
  integration-tests:
    runs-on: ubuntu-latest
    # Only run on main/develop push or PR to main
    if: github.event_name == 'push' || github.event.pull_request.base.ref == 'main'
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Integration_Test_P@ss1!"
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Integration_Test_P@ss1!' -Q 'SELECT 1' -N -C || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          sudo add-apt-repository "$(wget -qO- https://packages.microsoft.com/config/ubuntu/22.04/prod.list)"
          sudo apt-get update
          sudo apt-get install -y mssql-tools18 unixodbc-dev
          echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> ~/.bashrc

      - name: Create Test Database
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Integration_Test_P@ss1!' \
            -N -C \
            -Q "CREATE DATABASE TILSOFTAI_Test;"

      - name: Deploy SQL Migrations
        shell: pwsh
        run: |
          $conn = "Server=localhost;Database=TILSOFTAI_Test;User ID=sa;Password=Integration_Test_P@ss1!;TrustServerCertificate=True;"
          
          # Deploy in order: core, atomic, capabilities, seeds.
          # Optional legacy diagnostics under sql/97_legacy_diagnostics are not deployed by default.
          $folders = @(
            "sql/01_core",
            "sql/02_atomic",
            "sql/02_capabilities/analytics",
            "sql/02_capabilities/model",
            "sql/99_seed"
          )
          
          foreach ($folder in $folders) {
            if (Test-Path $folder) {
              $files = Get-ChildItem -Path $folder -Filter "*.sql" -Recurse | Sort-Object Name
              foreach ($file in $files) {
                Write-Host "Deploying: $($file.FullName)" -ForegroundColor Cyan
                /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Integration_Test_P@ss1!' -N -C -d TILSOFTAI_Test -i $file.FullName -b
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to deploy: $($file.FullName)"
                  exit 1
                }
              }
            }
          }
          Write-Host "All SQL migrations deployed successfully." -ForegroundColor Green

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Integration Tests
        run: dotnet test tests/TILSOFTAI.IntegrationTests --no-build --configuration Release --verbosity normal
        env:
          TEST_SQL_CONNECTION: "Server=localhost;Database=TILSOFTAI_Test;User ID=sa;Password=Integration_Test_P@ss1!;TrustServerCertificate=True;"

